<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HPSim Studio – moderner Editor und Simulator für Petri-Netze (Neuauflage von HPSim)." />
    <meta name="color-scheme" content="dark light" />
    <title>HPSim Studio</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b82f6'/%3E%3Cstop offset='.6' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='10' cy='16' r='5.5' fill='none' stroke='white' stroke-width='2.4'/%3E%3Ccircle cx='10' cy='16' r='2' fill='white'/%3E%3Crect x='18' y='7' width='4' height='18' rx='1' fill='white'/%3E%3C/svg%3E" />
    <style>
      html, body { background: #0b0f16; }
      html[data-theme='light'], html[data-theme='light'] body { background: #eef2f7; }
    </style>
    <script>
      try {
        var t = localStorage.getItem('hpsim-studio:theme');
        if (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>HPSim Studio benötigt JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
